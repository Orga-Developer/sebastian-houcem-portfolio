name: Build and deploy Sebastian's portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Validate public site URL
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Set the repository Actions variable SITE_URL to the real public origin before deploying."
            exit 1
          fi
      - name: Set the deployment base path
        shell: bash
        env:
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          base_path="$SITE_BASE_PATH"
          if [ -z "$base_path" ]; then
            repo_name="${GITHUB_REPOSITORY#*/}"
            owner_name="${GITHUB_REPOSITORY%%/*}"
            if [ "$repo_name" = "${owner_name}.github.io" ]; then
              base_path="/"
            else
              base_path="/${repo_name}/"
            fi
          fi
          if [[ ! "$base_path" =~ ^(/[A-Za-z0-9._~-]+)*/$ ]] || [[ "$base_path" == *"/./"* || "$base_path" == *"/../"* ]]; then
            echo "::error::SITE_BASE_PATH must be / or a slash-delimited path without empty or dot segments."
            exit 1
          fi
          echo "VITE_BASE_PATH=$base_path" >> "$GITHUB_ENV"
      - name: Build static site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
